<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGIS Kelvin Sibarani</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 18px;
      background: #164e63;
      color: white;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    p {
      margin: 8px 0;
      font-size: 14px;
    }

    #map {
      flex: 1;
      min-height: 300px;
    }

    .leaflet-popup-content {
      max-height: 250px;
      overflow: auto;
    }
  </style>
</head>

<body>
  <header>
    <h1>WebGIS Kelvin Sibarani</h1>

    <label for="file">Buka data peta GeoJSON:</label>
    <input
      id="file"
      type="file"
      accept=".geojson,.json"
    >

    <p id="status">
      Pilih berkas GeoJSON untuk menampilkan data petamu.
    </p>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map("map").setView([-5.4, 105.27], 12);

    const basemap = L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">' +
          "OpenStreetMap</a> contributors"
      }
    ).addTo(map);

    const controls = L.control.layers(
      { "OpenStreetMap": basemap },
      {},
      { collapsed: false }
    ).addTo(map);

    L.control.scale({
      imperial: false
    }).addTo(map);

    let dataLayer;

    document.getElementById("file").addEventListener(
      "change",
      async function (event) {
        const file = event.target.files[0];
        if (!file) return;

        const status = document.getElementById("status");

        try {
          const data = JSON.parse(await file.text());

          const nextLayer = L.geoJSON(data, {
            style: {
              color: "#dc2626",
              weight: 2,
              fillColor: "#f97316",
              fillOpacity: 0.3
            },

            pointToLayer: function (feature, latlng) {
              return L.circleMarker(latlng, {
                radius: 6,
                color: "#164e63",
                fillColor: "#06b6d4",
                fillOpacity: 0.9,
                weight: 2
              });
            },

            onEachFeature: function (feature, layer) {
              const popup = document.createElement("div");
              const properties = feature.properties || {};
              const entries = Object.entries(properties);

              if (entries.length === 0) {
                popup.textContent = "Objek ini tidak memiliki atribut.";
              }

              for (const [key, value] of entries) {
                const row = document.createElement("div");
                row.textContent = key + ": " +
                  (value === null ? "-" :
                    typeof value === "object"
                      ? JSON.stringify(value)
                      : String(value));
                popup.appendChild(row);
              }

              layer.bindPopup(popup);
            }
          });

          const bounds = nextLayer.getBounds();

          if (!bounds.isValid()) {
            throw new Error("Data tidak memiliki geometri yang bisa ditampilkan.");
          }

          if (dataLayer) {
            map.removeLayer(dataLayer);
            controls.removeLayer(dataLayer);
          }

          dataLayer = nextLayer;
          dataLayer.addTo(map);
          controls.addOverlay(dataLayer, file.name);
          map.fitBounds(bounds, { padding: [25, 25] });

          status.textContent =
            "Data berhasil ditampilkan: " + file.name +
            ". Klik objek untuk melihat atribut.";
        } catch (error) {
          status.textContent = "Gagal membuka data: " + error.message;
          console.error(error);
        }
      }
    );
  </script>
</body>
